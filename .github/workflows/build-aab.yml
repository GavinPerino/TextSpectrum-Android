name: Build AAB   
on:
  push:     
    branches: [ main ]   
  workflow_dispatch: 

jobs:   
  build:     
    runs-on: ubuntu-latest     
    defaults:       
      run:         
        # Tells GitHub to execute ALL build commands natively inside this project folder
        working-directory: TextSpectrum-Android     
    steps:       
      - name: Checkout repository         
        uses: actions/checkout@v4       

      - name: Set up JDK 17         
        uses: actions/setup-java@v4         
        with:           
          distribution: 'temurin'           
          java-version: '17'           

      # This safely configures your background compiler engines
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Runs the native layout assembly command
      - name: Build Debug AAB         
        run: gradle bundleDebug --stacktrace       

      - name: Upload AAB         
        uses: actions/upload-artifact@v4         
        with:           
          name: app-debug-aab           
          # Maps the exact generated directory location
          path: TextSpectrum-Android/app/build/outputs/bundle/debug/app-debug.aab           
          if-no-files-found: error
