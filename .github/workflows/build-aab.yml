name: Build AAB   
on:
  push:     
    branches: [ main ]   
  workflow_dispatch: 

jobs:   
  build:     
    runs-on: ubuntu-latest     
    steps:       
      - name: Checkout repository         
        uses: actions/checkout@v4       

      - name: Set up JDK 17         
        uses: actions/setup-java@v4         
        with:           
          distribution: 'temurin'           
          java-version: '17'           

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Safely restructures the workspace to satisfy Gradle 9 rules
      - name: Restructure Project Worktree
        run: |
          mkdir -p TextSpectrum-Android/app
          cp -r app/* TextSpectrum-Android/app/

      # Executes compilation securely from the target folder
      - name: Build Debug AAB         
        run: |
          cd TextSpectrum-Android
          gradle :app:bundleDebug --info--stacktrace       

      - name: Upload AAB         
        uses: actions/upload-artifact@v4         
        with:           
          name: app-debug-aab           
          path: TextSpectrum-Android/app/build/outputs/bundle/debug/app-debug.aab           
          if-no-files-found: error
