name: Build AAB   
on:
  push:     
    branches: [ main ]   
  workflow_dispatch: 

jobs:   
  build:     
    runs-on: ubuntu-latest     
    defaults:       
      run:         
        working-directory: TextSpectrum-Android     
    steps:       
      - name: Checkout repository         
        uses: actions/checkout@v4       

      - name: Set up JDK 17         
        uses: actions/setup-java@v4         
        with:           
          distribution: 'temurin'           
          java-version: '17'           

      # Official Gradle setup that optimizes builds and unlocks the global 'gradle' command
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Changed from "./gradlew" to global "gradle" since local wrapper doesn't exist
      - name: Build Debug AAB         
        run: gradle bundleDebug --stacktrace       

      - name: Upload AAB         
        uses: actions/upload-artifact@v4         
        with:           
          name: app-debug-aab           
          path: TextSpectrum-Android/app/build/outputs/bundle/debug/app-debug.aab           
          if-no-files-found: error
