name: Build and Sign Production AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Unify Split Mobile Folders
        run: |
          mkdir -p TextSpectrum-Android/app
          cp -r app/* TextSpectrum-Android/app/

      - name: Generate Production Keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore TextSpectrum-Android/app/keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "CN=Gavin Perino, OU=Development, O=TextSpectrum, L=Jeffreys Bay, ST=Eastern Cape, C=ZA"

      - name: Build Production Release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd TextSpectrum-Android
          gradle :app:bundleRelease --warning-mode=none

      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: TextSpectrum-Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: production-keystore-backup
          path: TextSpectrum-Android/app/keystore.jks
          if-no-files-found: error
